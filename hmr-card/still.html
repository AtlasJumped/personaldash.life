<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Demo still</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#454545;--ac:#b83c00;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0a0a0a;--fg:#f5f5f5;--mut:#c8c8c8;--ac:#ff6a1a}}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:24px 16px}
main{max-width:960px;margin:0 auto}
h1{font-size:1.5rem;line-height:1.2;margin:0 0 8px}
p{margin:0 0 16px;color:var(--mut);max-width:62ch}
img{display:block;width:100%;height:auto;border-radius:8px;margin:0 0 16px}
a{color:var(--ac);font-weight:600}
</style>
</head>
<body>
<main>
<h1>A still picture of the demo</h1>
<p>The moving demo could not play in this browser, so here is a still picture of the demo dashboard. It uses made-up data, and nothing is sent.</p>
<img src="still.svg" alt="A still picture of the demo dashboard, with made-up data." width="960" height="540">
<p><a href="../">Back to the site</a></p>
</main>
</body>
</html>
